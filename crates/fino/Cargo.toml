[package]
name = "fino"
description = "Fine-grained reactive cross-platform UI core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Enables the real browser DOM backend for wasm32 builds.
# 为 wasm32 构建启用真实浏览器 DOM 后端。
web = ["dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]
# Enables the native DOM, text, layout, offscreen, and winit/wgpu host.
# 启用原生 DOM、文本、布局、离屏与 winit/wgpu Host。
native = [
    "dep:bytemuck",
    "dep:fontique",
    "dep:parley",
    "dep:pollster",
    "dep:skrifa",
    "dep:slotmap",
    "dep:thiserror",
    "dep:tiny-skia",
    "dep:wgpu",
    "dep:winit",
]

[dependencies]
bytemuck = { workspace = true, optional = true }
fontique = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
parley = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }
reactive_graph.workspace = true
schemars.workspace = true
send_wrapper.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
skrifa = { workspace = true, optional = true }
slotmap = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tiny-skia = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
