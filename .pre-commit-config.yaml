repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace --all-targets --locked
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        pass_filenames: false
        always_run: true
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --locked
        language: system
        pass_filenames: false
        always_run: true
