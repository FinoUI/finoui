name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to full commit SHAs so their code cannot
      # change under us; bump the SHA and the trailing version comment together.
      # 第三方 action 固定到完整 commit SHA，避免上游代码被替换；
      # 升级时同时更新 SHA 和末尾的版本注释。
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        # Only the action's implementation is pinned. Its toolchain is named
        # explicitly because it otherwise derives it from @rev, which is a SHA
        # here; the installed version still comes from rust-toolchain.toml and
        # follows new stable releases.
        # 这里只固定 action 本身的实现。由于改用 SHA 后 action 会把 @rev 当作
        # 工具链名，所以必须显式指定 toolchain；实际安装的版本仍由
        # rust-toolchain.toml 决定，会跟随新的 stable 发布。
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  wasm-web:
    name: wasm browser scenario
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The CLI version must match the wasm-bindgen crate exactly.
      # CLI 版本必须与 wasm-bindgen crate 完全一致。
      - name: Install wasm-bindgen
        run: |
          curl -sSfL https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.129/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen /usr/local/bin/
      # Playwright owns Chromium download and system dependencies.
      # Chromium 下载与系统依赖由 Playwright 负责。
      - name: Install Playwright
        run: |
          npm ci --prefix examples/counter/web
          npx --prefix examples/counter/web playwright install --with-deps chromium
      - name: Run wasm browser scenario
        run: cargo test -p fino_counter --test web_browser -- --ignored --nocapture
